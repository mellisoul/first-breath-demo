<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16212D">
<meta name="description" content="First Breath — ИИ-помощник дыхательной реабилитации дома. Команда TYNYS, AI-Sana Startup Challenge 2026.">
<title>First Breath — дыхательная реабилитация дома</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316212D'/%3E%3Cpath d='M6 36 C14 36 16 20 24 20 S34 46 42 46 S52 30 58 30' fill='none' stroke='%239FD3CF' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body>
<template id="lungsTpl"><svg xmlns="http://www.w3.org/2000/svg">
  <g class="lobes">
    <path class="lobe" d="M165 150 C110 160 70 230 62 320 C58 390 80 440 140 450 C175 455 190 430 192 400 L192 210 C192 180 185 155 165 150 Z"/>
    <path class="lobe" d="M235 150 C290 160 330 230 338 320 C342 390 320 440 260 450 C225 455 208 430 208 400 L208 210 C208 180 215 155 235 150 Z"/>
    <path class="tree" d="M146 206 C130 222 116 236 104 254 M146 206 C146 230 142 250 134 270 M104 254 C92 262 84 274 80 290 M104 254 C108 270 104 284 98 298 M134 270 C124 282 120 296 120 312 M134 270 C142 286 144 302 140 318 M254 206 C270 222 284 236 296 254 M254 206 C254 230 258 250 266 270 M296 254 C308 262 316 274 320 290 M296 254 C292 270 296 284 302 298 M266 270 C276 282 280 296 280 312 M266 270 C258 286 256 302 260 318"/>
  </g>
  <path class="airway" d="M193 30 L193 158 C183 172 168 186 146 206 M207 30 L207 158 C217 172 232 186 254 206"/>
</svg></template>

<header class="nav">
  <a class="brand" href="#top" aria-label="First Breath">
    <svg viewBox="0 0 64 32" aria-hidden="true"><path d="M2 18 C10 18 12 6 20 6 S30 28 38 28 S50 14 62 14"/></svg>
    <span>First Breath</span>
  </a>
  <nav class="links">
    <a href="#problem" data-i18n="navProblem"></a>
    <a href="#how" data-i18n="navHow"></a>
    <a href="#app" data-i18n="navApp"></a>
    <a href="#team" data-i18n="navTeam"></a>
  </nav>
  <div class="lang" role="group" aria-label="Язык">
    <button type="button" data-lang="ru" class="on">RU</button>
    <button type="button" data-lang="kk">KZ</button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-inner">
      <div class="hero-copy">
        <h1 data-i18n="heroTitle"></h1>
        <p class="hero-sub" data-i18n="heroBody"></p>
        <div class="hero-cta">
          <a class="btn accent" href="#app" data-i18n="ctaStart"></a>
          <a class="btn line-light" href="#how" data-i18n="ctaHow"></a>
        </div>
      </div>
      <div class="monitor" aria-label="Пример кривой дыхания">
        <div class="mon-head">
          <span data-i18n="monTitle"></span>
          <span class="mon-ex" data-i18n="ex_diaphragm"></span>
        </div>
        <div class="mon-body">
          <canvas id="heroTrace" width="1200" height="360"></canvas>
          <dl class="mon-read">
            <div><dt data-i18n="readRate"></dt><dd><b>6</b><small>/мин</small></dd></div>
            <div><dt data-i18n="readPhase"></dt><dd><b id="heroPhase"></b></dd></div>
            <div><dt data-i18n="readPattern"></dt><dd><b>4 : 6</b><small data-i18n="sec"></small></dd></div>
          </dl>
        </div>
      </div>
    </div>
    <ul class="facts">
      <li><b data-i18n="factMic"></b><span data-i18n="factMicD"></span></li>
      <li><b data-i18n="factLang"></b><span data-i18n="factLangD"></span></li>
      <li><b data-i18n="factDoc"></b><span data-i18n="factDocD"></span></li>
    </ul>
  </section>

  <section class="sec" id="problem">
    <div class="sec-intro">
      <h2 data-i18n="problemTitle"></h2>
      <p data-i18n="problemLede"></p>
    </div>
    <div class="nums">
      <figure><b>0,4%</b><figcaption><span data-i18n="stat1"></span><cite>CORE, 2018</cite></figcaption></figure>
      <figure><b>12%</b><figcaption><span data-i18n="stat2"></span><cite>Vinnikov et al., BMC Pulm Med, 2023</cite></figcaption></figure>
      <figure><b>4%</b><figcaption><span data-i18n="stat3"></span><cite>Vinnikov et al., BMC Pulm Med, 2023</cite></figcaption></figure>
    </div>
  </section>

  <section class="sec" id="how">
    <div class="sec-intro">
      <h2 data-i18n="howTitle"></h2>
      <p data-i18n="howLede"></p>
    </div>
    <ol class="flow">
      <li><h3 data-i18n="how1"></h3><p data-i18n="how1d"></p></li>
      <li><h3 data-i18n="how2"></h3><p data-i18n="how2d"></p></li>
      <li><h3 data-i18n="how3"></h3><p data-i18n="how3d"></p></li>
      <li><h3 data-i18n="how4"></h3><p data-i18n="how4d"></p></li>
    </ol>
  </section>

  <section class="sec app" id="app">
    <div class="app-head">
      <div>
        <h2 data-i18n="appTitle"></h2>
        <p data-i18n="appLede"></p>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" class="tab-btn on" data-go="setup" data-i18n="tabSession"></button>
        <button type="button" class="tab-btn" data-go="report" data-i18n="tabReport"></button>
      </div>
    </div>

    <div class="work">
      <div class="screen active" id="setup">
        <div class="setup-grid">
          <div class="panel">
            <h3 class="ph" data-i18n="chooseEx"></h3>
            <div class="choices" id="exList"></div>
            <div class="row2">
              <div>
                <h3 class="ph" data-i18n="duration"></h3>
                <div class="seg" id="durList">
                  <button type="button" data-min="1">1</button>
                  <button type="button" data-min="3" class="on">3</button>
                  <button type="button" data-min="5">5</button>
                </div>
              </div>
              <div>
                <h3 class="ph" data-i18n="sound"></h3>
                <div class="seg" id="soundSeg">
                  <button type="button" data-sound="1" class="on" data-i18n="on"></button>
                  <button type="button" data-sound="0" data-i18n="off"></button>
                </div>
              </div>
            </div>
          </div>
          <div class="panel">
            <label class="field">
              <span class="ph" data-i18n="patient"></span>
              <input id="patient" type="text" autocomplete="off" data-i18n-ph="patientPh">
            </label>
            <div class="borg">
              <div class="borg-top"><h3 class="ph" data-i18n="borgPre"></h3><output id="borgPreLab"></output></div>
              <input type="range" min="0" max="10" step="1" value="2" id="borgPre" aria-describedby="borgPreLab">
              <div class="ticks" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div>
            </div>
            <div class="week-wrap">
              <h3 class="ph" data-i18n="weekTitle"></h3>
              <div class="week" id="week"></div>
            </div>
            <div class="actions">
              <button type="button" class="btn primary" id="startMic" data-i18n="startMic"></button>
              <button type="button" class="btn line" id="startSim" data-i18n="startSim"></button>
            </div>
            <p class="hint-small" data-i18n="micTip"></p>
          </div>
        </div>
      </div>

      <div class="screen" id="session">
        <div class="monitor big">
          <div class="mon-head">
            <span id="exName"></span>
            <span class="sim-flag" id="simBadge" data-i18n="simBadge" hidden></span>
            <span class="timer" id="timer">0:00</span>
          </div>
          <div class="progress"><i id="prog"></i></div>
          <div class="sess-grid">
            <div class="pacer">
              <svg class="ring" viewBox="0 0 300 300" aria-hidden="true">
                <circle cx="150" cy="150" r="140" class="ring-bg"/>
                <circle cx="150" cy="150" r="140" class="ring-fg" id="ring"/>
              </svg>
              <svg class="lungs" id="sLungs" viewBox="0 0 400 470" aria-hidden="true"></svg>
              <div class="count" id="count" hidden></div>
              <div class="phase"><strong id="phaseText"></strong><span id="phaseCount"></span></div>
            </div>
            <div class="sess-data">
              <div class="trace-head"><span data-i18n="traceTitle"></span><span class="hear" id="hear"><i></i><span></span></span></div>
              <canvas id="wave" width="900" height="260" aria-label="Кривая дыхания"></canvas>
              <dl class="mon-read row">
                <div><dt data-i18n="rate"></dt><dd><b id="rate">—</b><small>/мин</small></dd></div>
                <div><dt data-i18n="regularity"></dt><dd><b id="reg">—</b></dd></div>
                <div><dt data-i18n="exhaleOk"></dt><dd><b id="adh">—</b></dd></div>
              </dl>
              <div class="hint" id="aiHint"><span data-i18n="aiLabel"></span><p id="hintText"></p></div>
              <button type="button" class="btn line-light" id="stop" data-i18n="finish"></button>
            </div>
          </div>
        </div>
      </div>

      <div class="screen" id="post">
        <div class="panel narrow">
          <h3 class="title-m" data-i18n="borgPost"></h3>
          <div class="borg">
            <div class="borg-top"><span></span><output id="borgPostLab"></output></div>
            <input type="range" min="0" max="10" step="1" value="2" id="borgPost" aria-describedby="borgPostLab">
            <div class="ticks" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div>
          </div>
          <button type="button" class="btn primary wide" id="toSummary" data-i18n="seeSummary"></button>
        </div>
      </div>

      <div class="screen" id="summary">
        <div class="panel narrow">
          <h3 class="title-m" data-i18n="summary"></h3>
          <div class="sum-top">
            <div><b id="sumReg">—</b><span data-i18n="regularity"></span></div>
            <div><b id="sumRate">—</b><span data-i18n="avgRate"></span></div>
          </div>
          <dl class="kv">
            <div><dt data-i18n="duration"></dt><dd id="sumDur"></dd></div>
            <div><dt data-i18n="exhaleOk"></dt><dd id="sumAdh"></dd></div>
            <div><dt data-i18n="borgShort"></dt><dd id="sumBorg"></dd></div>
          </dl>
          <div class="hint light"><span data-i18n="nextSession"></span><p id="sumNext"></p></div>
          <div class="actions two">
            <button type="button" class="btn primary" data-go="report" data-i18n="openReport"></button>
            <button type="button" class="btn line" data-go="setup" data-i18n="again"></button>
          </div>
        </div>
      </div>

      <div class="screen" id="report">
        <article class="sheet">
          <header class="sheet-head">
            <div>
              <h3 data-i18n="report"></h3>
              <p id="repPatient"></p>
            </div>
            <p class="sheet-src">First Breath<br><span data-i18n="sheetSrc"></span></p>
          </header>
          <dl class="sheet-kpi">
            <div><dt data-i18n="sessions7"></dt><dd id="repCount">0</dd></div>
            <div><dt data-i18n="norm"></dt><dd id="repNorm">—</dd></div>
            <div><dt data-i18n="lastRate"></dt><dd id="repLast">—</dd></div>
            <div><dt data-i18n="borgAvg"></dt><dd id="repBorg">—</dd></div>
          </dl>
          <p class="flag" id="repFlag"></p>
          <h4 data-i18n="trend"></h4>
          <canvas id="trend" width="900" height="300" aria-label="Динамика"></canvas>
          <table class="tbl">
            <thead><tr><th data-i18n="date"></th><th data-i18n="exercise"></th><th data-i18n="min"></th><th data-i18n="rateShort"></th><th data-i18n="regShort"></th><th data-i18n="borgCol"></th></tr></thead>
            <tbody id="repRows"></tbody>
          </table>
          <p class="empty" id="repEmpty" data-i18n="empty"></p>
          <p class="sheet-note" data-i18n="disclaimer"></p>
        </article>
        <div class="sheet-actions no-print">
          <button type="button" class="btn primary" id="print" data-i18n="savePdf"></button>
          <button type="button" class="btn line" id="csv" data-i18n="csv"></button>
          <button type="button" class="btn line" id="seed" data-i18n="seed"></button>
          <button type="button" class="btn text" id="clear" data-i18n="clear"></button>
        </div>
      </div>
    </div>
    <p class="note" data-i18n="disclaimer"></p>
  </section>

  <section class="sec" id="team">
    <div class="sec-intro">
      <h2 data-i18n="teamTitle"></h2>
      <p data-i18n="teamLede"></p>
    </div>
    <ul class="team">
      <li><b>Имашова Дариға</b><span data-i18n="roleLead"></span></li>
      <li><b>Манат Нурсауле</b><span data-i18n="roleAi"></span></li>
      <li><b>Ғайбен Дара</b><span data-i18n="rolePm"></span></li>
      <li><b>Бақытқызы Ұлбике</b><span data-i18n="rolePm"></span></li>
      <li><b>Оралбек Әділет</b><span data-i18n="roleDev"></span></li>
    </ul>
  </section>
</main>

<footer class="foot">
  <span>First Breath</span>
  <span data-i18n="footer"></span>
</footer>

<div class="toast" id="toast" role="status"></div>
<script src="i18n.js"></script>
<script src="breath.js"></script>
<script src="app.js"></script>
</body>
</html>
